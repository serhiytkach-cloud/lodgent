name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        # Integration tests start pgvector Postgres through Testcontainers (Docker is available on the runner).
        run: pnpm test
      - name: Build
        run: pnpm build

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cdk:synth

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layer cache in the GitHub Actions cache: main writes it (deploys read it too), pull
      # requests only read it, so they do not crowd out main's entries.
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ci/api:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=image-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-api,ignore-error=true' || '' }}
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          tags: ci/worker:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=image-worker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-worker,ignore-error=true' || '' }}
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ci/web:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=image-web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image-web,ignore-error=true' || '' }}
      - name: Smoke-test the images
        env:
          API_IMAGE: ci/api:${{ github.sha }}
          WORKER_IMAGE: ci/worker:${{ github.sha }}
          WEB_IMAGE: ci/web:${{ github.sha }}
        run: .github/scripts/smoke-test-images.sh

  security:
    name: Secrets scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
